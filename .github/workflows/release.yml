# Publishes a GitHub release with the notes of that version from CHANGELOG.md and a source tarball.
# Either push a tag like v3.3.1 (matching the VERSION file), or run this workflow by hand
# (Actions → Release → Run workflow): it tags the current commit with v<VERSION>, replacing that release if it exists.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION $v"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { if (p) exit; if (index($0, "[" v "]") || index($0, " " v)) { p = 1; next } }
            p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          printf '\n---\nInstall: `curl -fsSL https://raw.githubusercontent.com/%s/main/get.sh | sudo bash` · Update: `sudo sdrkit update`\n' "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      - name: Source tarball
        run: git archive --format=tar.gz --prefix="sdrkit-$VERSION/" -o "sdrkit-$VERSION.tar.gz" HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "sdrkit-$VERSION.tar.gz" > "sdrkit-$VERSION.tar.gz.sha256"
          # run by hand on a version that is already published: replace it (and its tag) with this commit
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then gh release delete "$TAG" --cleanup-tag --yes || true; fi
          gh release create "$TAG" "sdrkit-$VERSION.tar.gz" "sdrkit-$VERSION.tar.gz.sha256" \
            --target "$GITHUB_SHA" --title "SDR-Kit $VERSION" --notes-file notes.md
