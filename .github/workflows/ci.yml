# Runs on every push and pull request. A red check means: do not update the Pi yet.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · DSP & decoders (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # Raspberry Pi OS Bookworm / Trixie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq multimon-ng
          pip install numpy pytest ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 files tests
      - name: Compile
        run: python -m py_compile files/*.py
      - name: Unit and integration tests
        run: pytest -v tests

  web:
    name: Web panel · syntax & translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: for f in files/web/*.js; do node --check "$f"; done
      - name: English catalog is complete and consistent
        run: node tests/i18n_check.mjs

  shell:
    name: Shell · installer, updater, CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          bash -n install.sh get.sh files/*.sh
          shellcheck -S warning -x install.sh get.sh files/*.sh

  e2e:
    name: End to end · demo panel decodes real signals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq multimon-ng
          pip install numpy
      - name: Start the panel in demo mode
        run: |
          export SDRKIT_STATE="$RUNNER_TEMP/state"
          python files/sdrkit_server.py --demo --port 8080 --conf /nonexistent > "$RUNNER_TEMP/panel.log" 2>&1 &
          for i in $(seq 30); do curl -fs localhost:8080/api/status > /dev/null && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "SDR-Kit"
          curl -fs localhost:8080/api/status | python -c "import json,sys; d=json.load(sys.stdin); assert d['demo'], d; print('version', d['version'])"
          curl -fs localhost:8080/api/decoders > /dev/null
      - name: Decode a POCSAG pager message end to end
        run: |
          curl -fs -H 'Content-Type: application/json' \
            -d '{"freq":152840000,"mod":"nfm","data":["pocsag"],"activate":true}' localhost:8080/api/radio > /dev/null
          for i in $(seq 40); do
            n=$(curl -fs localhost:8080/api/decoded | python -c "import json,sys; print(sum(1 for x in json.load(sys.stdin)['items'] if x.get('kind','').startswith('POCSAG')))")
            [ "$n" -gt 0 ] && { echo "POCSAG messages decoded: $n"; exit 0; }
            sleep 1
          done
          exit 1
      - name: Decode an APRS packet end to end
        run: |
          curl -fs -H 'Content-Type: application/json' \
            -d '{"freq":144390000,"mod":"nfm","data":["aprs"],"activate":true}' localhost:8080/api/radio > /dev/null
          for i in $(seq 40); do
            n=$(curl -fs localhost:8080/api/decoded | python -c "import json,sys; print(sum(1 for x in json.load(sys.stdin)['items'] if x.get('kind')=='APRS'))")
            [ "$n" -gt 0 ] && { echo "APRS packets decoded: $n"; exit 0; }
            sleep 1
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser smoke test in English and Spanish
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/ui_smoke.mjs http://127.0.0.1:8080
      - name: Panel log
        if: always()
        run: cat "$RUNNER_TEMP/panel.log" || true
