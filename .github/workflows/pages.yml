# Publishes the project web page (site/) with GitHub Pages; this shows up under "Deployments".
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", "VERSION", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp -r docs/media/. _site/media/
          sed -i "s/__VERSION__/$(tr -d '[:space:]' < VERSION)/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
