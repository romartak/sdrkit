# Publishes the demo image to GitHub Packages (ghcr.io/<owner>/sdrkit) so anyone can try SDR-Kit with
#   docker run --rm -p 8080:8080 ghcr.io/romartak/sdrkit:latest
name: Docker demo image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$img:latest"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags,$img:${GITHUB_REF_NAME#v}";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SDR-Kit demo mode (no hardware needed)
            org.opencontainers.image.licenses=MIT
