name: ✨ Feature request
description: Suggest an idea or a new decoder/mode
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case first (what you want to receive, measure or decode), then your idea.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: limits
    attributes:
      label: Constraints
      options:
        - label: It can run on a Raspberry Pi Zero 2 W next to the SDR stream
        - label: It is receive-only and does not involve decrypting encrypted traffic
