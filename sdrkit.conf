# =====================================================================
#  SDR-Kit · configuración
#  Edítalo ANTES de instalar (puedes hacerlo desde la PC, en la partición
#  "bootfs" de la microSD, con el Bloc de notas).
#  Reglas: escribe los valores entre comillas "así". No uses comillas
#  dobles (") dentro de las claves. Si dejas una clave vacía (""), el
#  instalador te la pedirá.
# =====================================================================

# --- Hotspot: la red WiFi que crea la Raspberry cuando no hay WiFi conocida ---
HOTSPOT_SSID="SDR-Pi"
HOTSPOT_PASSWORD=""            # mínimo 8 caracteres
HOTSPOT_CHANNEL="6"            # 1, 6 u 11 (2.4 GHz; la Zero 2 W no tiene 5 GHz)
HOTSPOT_IP="192.168.4.1"       # el panel quedará en http://192.168.4.1

# --- Clave del panel web y del usuario "admin" de OpenWebRX+ ---
ADMIN_PASSWORD=""

# --- Redes WiFi extra que la Raspberry debe conocer ---
# La WiFi de tu casa ya la configuras en Raspberry Pi Imager. Aquí puedes
# agregar otras, por ejemplo el hotspot de tu celular, para tener acceso
# remoto en la calle. Formato: "Red1|clave1;Red2|clave2"
WIFI_NETWORKS=""
WIFI_COUNTRY=""                # código de país: MX, CO, AR, CL, PE, DO, VE, EC, ES, US… vacío = no cambiar

# --- Comportamiento de la red ---
BOOT_WAIT="45"                 # segundos que espera una WiFi conocida antes de crear el hotspot
HOME_RETRY_MIN="5"             # con el hotspot encendido y nadie conectado, cada cuántos minutos
                               # vuelve a buscar tus redes conocidas (0 = nunca)

# --- Radio ---
REGION="americas"              # americas | europa  (deénfasis FM 75/50 µs, canales de aviación,
                               # walkie-talkies FRS/GMRS o PMR446)
RTL_MODEL="v4"                 # v4 = RTL-SDR Blog V4 (recomendado) | v3 = RTL-SDR Blog V3 | otro
RTLSDR_DRIVER="auto"           # auto | distro | blog  (auto: compila el driver de RTL-SDR Blog
                               # sólo si tu sistema es Bookworm, cuyo driver no soporta el V4)
BIAS_TEE="no"                  # "si" para alimentar un LNA o antena activa por el coaxial (V3/V4)
RTL_PPM="0"                    # corrección de frecuencia (el V3/V4 tienen TCXO: deja 0)
DEFAULT_MODE="last"            # al encender: last (el último usado) | sweep (analizador) | radio |
                               # sensors (sensores 433) | adsb (radar de aviones) | receiver
RECEIVER_NAME="SDR-Kit"        # nombre que muestra OpenWebRX+
RECEIVER_LOCATION=""           # ej. "Santo Domingo, RD" (opcional)
RECEIVER_LAT=""                # tu latitud en grados (ej. 18.4861): centro del radar de aviones
RECEIVER_LON=""                # tu longitud (ej. -69.9312). También se puede poner desde el panel

# --- Grabaciones (pestaña Radio → Grabar) ---
REC_DIR=""                     # carpeta; vacío = /var/lib/sdrkit/grabaciones (una subcarpeta por día)
REC_MAX_MB="2000"              # espacio máximo; si se llena se borran las grabaciones más viejas
REC_MIN_SEC="1"                # en la grabación automática se descartan transmisiones más cortas

# --- Voz digital y decodificadores ---
INSTALL_DSD=""                 # "si" = compila DSD-FME: DMR, P25, D-Star, Fusion, NXDN, dPMR y M17 en el
                               # panel. Usa códecs AMBE/IMBE PATENTADOS: lee el aviso en la guía (sección 9).
                               # vacío = el instalador te pregunta | "no" = no instalar
AMBE_TTY=""                    # llave USB AMBE3000 (ThumbDV/DVstick): ej. "/dev/ttyUSB0" → voz digital
AMBE_BAUD="921600"             # con licencia en el receptor avanzado. ThumbDV antiguo: "460800"
INSTALL_WSJTX="no"             # "si" = FT8/FT4/WSPR/JS8 en el receptor avanzado (≈300 MB más)

# --- Avisos al celular (alarmas de la vigilancia 24/7) ---
NTFY_TOPIC=""                  # un nombre difícil de adivinar, ej. "sdrkit-casa-7f3k9"; instala la app «ntfy»
NTFY_SERVER="https://ntfy.sh"  # y suscríbete a ese tema. Necesita internet en la Raspberry

# --- Actualizaciones (sudo sdrkit actualizar, o el botón en Más → Sistema) ---
SDRKIT_REPO=""                 # vacío = el repositorio de GitHub desde el que instalaste
SDRKIT_BRANCH=""               # vacío = "main" (versión estable). Ej. "pruebas" para probar cambios

# --- Extras ---
INSTALL_TAILSCALE="si"         # acceso remoto seguro desde cualquier lugar (gratis para uso personal)
TAILSCALE_AUTHKEY=""           # opcional: clave "tskey-auth-…" para enlazarlo sin abrir el navegador
DISABLE_BLUETOOTH="si"         # no se usa; apagarlo mejora el WiFi (comparten el mismo chip)
REDUCE_SD_WRITES="si"          # registros en RAM: alarga la vida de la microSD
UPGRADE_SYSTEM="no"            # "si" = actualiza todo el sistema antes de instalar (tarda más)
PANEL_PORT="80"
