# =====================================================================
#  SDR-Kit · configuration · configuración
#  Edit it BEFORE installing (also from your PC: "bootfs" partition of the
#  microSD, with Notepad). Values go in double quotes "like this"; do not
#  use " inside passwords; an empty password ("") is asked by the installer.
#  Edítalo ANTES de instalar (también desde la PC: partición "bootfs" de la
#  microSD, con el Bloc de notas). Escribe los valores entre comillas "así";
#  no uses " dentro de las claves; si dejas una clave vacía (""), el
#  instalador te la pedirá.
# =====================================================================

# --- Language · Idioma ---
SDRKIT_LANG=""                 # en | es · empty = asked at install · vacío = se pregunta al instalar

# --- Hotspot: the WiFi network the Pi creates when no known WiFi is around ---
# --- Hotspot: la red WiFi que crea la Raspberry cuando no hay WiFi conocida ---
HOTSPOT_SSID="SDR-Pi"
HOTSPOT_PASSWORD=""            # min. 8 characters · mínimo 8 caracteres
HOTSPOT_CHANNEL="6"            # 1, 6 or 11 (2.4 GHz; the Zero 2 W has no 5 GHz)
                               # 1, 6 u 11 (2.4 GHz; la Zero 2 W no tiene 5 GHz)
HOTSPOT_IP="192.168.4.1"       # panel at http://192.168.4.1 · el panel quedará en http://192.168.4.1

# --- Password of the web panel and of the OpenWebRX+ "admin" user ---
# --- Clave del panel web y del usuario "admin" de OpenWebRX+ ---
ADMIN_PASSWORD=""

# --- Extra WiFi networks the Pi should know · Redes WiFi extra que la Raspberry debe conocer ---
# Your home WiFi is set in Raspberry Pi Imager. Add others here, e.g. your phone's hotspot for remote
# access in the field. · La WiFi de tu casa ya la configuras en Raspberry Pi Imager. Aquí puedes agregar
# otras, por ejemplo el hotspot de tu celular, para tener acceso remoto en la calle.
# Format · Formato: "Network1|password1;Network2|password2"
WIFI_NETWORKS=""
WIFI_COUNTRY=""                # country code · código de país: MX, CO, AR, CL, PE, DO, VE, EC, ES, US…
                               # empty = unchanged · vacío = no cambiar

# --- Network behavior · Comportamiento de la red ---
BOOT_WAIT="45"                 # seconds to wait for a known WiFi before starting the hotspot
                               # segundos que espera una WiFi conocida antes de crear el hotspot
HOME_RETRY_MIN="5"             # hotspot on and nobody connected: every how many minutes it looks
                               # for your known networks again (0 = never)
                               # con el hotspot encendido y nadie conectado, cada cuántos minutos
                               # vuelve a buscar tus redes conocidas (0 = nunca)

# --- Radio ---
REGION="americas"              # americas | europa (FM de-emphasis 75/50 µs, airband channels, FRS/GMRS or PMR446)
                               # americas | europa (deénfasis FM 75/50 µs, canales de aviación, FRS/GMRS o PMR446)
RTL_MODEL="v4"                 # v4 = RTL-SDR Blog V4 (recommended · recomendado) | v3 = RTL-SDR Blog V3 | other · otro
RTLSDR_DRIVER="auto"           # auto | distro | blog (auto: builds the RTL-SDR Blog driver only on Bookworm,
                               # whose driver does not support the V4) · (auto: compila el driver de RTL-SDR Blog
                               # sólo si tu sistema es Bookworm, cuyo driver no soporta el V4)
BIAS_TEE="no"                  # "yes" powers an LNA or active antenna through the coax (V3/V4)
                               # "si" para alimentar un LNA o antena activa por el coaxial (V3/V4)
RTL_PPM="0"                    # frequency correction (V3/V4 have a TCXO: leave 0)
                               # corrección de frecuencia (el V3/V4 tienen TCXO: deja 0)
DEFAULT_MODE="last"            # at power-on · al encender: last (último usado) | sweep (analyzer · analizador) |
                               # radio | sensors (433 MHz) | adsb (aircraft radar · radar de aviones) | receiver
RECEIVER_NAME="SDR-Kit"        # name shown by OpenWebRX+ · nombre que muestra OpenWebRX+
RECEIVER_LOCATION=""           # e.g. · ej. "Santo Domingo, RD" (optional · opcional)
RECEIVER_LAT=""                # latitude in degrees (e.g. 18.4861): aircraft radar center · tu latitud (centro del radar)
RECEIVER_LON=""                # longitude (e.g. -69.9312); also settable from the panel · también desde el panel

# --- Recordings (Radio tab → Record) · Grabaciones (pestaña Radio → Grabar) ---
REC_DIR=""                     # folder; empty = /var/lib/sdrkit/grabaciones (one subfolder per day)
                               # carpeta; vacío = /var/lib/sdrkit/grabaciones (una subcarpeta por día)
REC_MAX_MB="2000"              # maximum space; when full the oldest recordings are deleted
                               # espacio máximo; si se llena se borran las grabaciones más viejas
REC_MIN_SEC="1"                # auto-record drops shorter transmissions · en la grabación automática
                               # se descartan transmisiones más cortas

# --- Digital voice and decoders · Voz digital y decodificadores ---
INSTALL_DSD=""                 # "yes" = build DSD-FME: DMR, P25, D-Star, Fusion, NXDN, dPMR and M17 in the panel.
                               # It uses PATENTED AMBE/IMBE codecs: read the notice in the guide (section 9).
                               # empty = the installer asks | "no" = do not install
                               # "si" = compila DSD-FME: DMR, P25, D-Star, Fusion, NXDN, dPMR y M17 en el panel.
                               # Usa códecs AMBE/IMBE PATENTADOS: lee el aviso en la guía (sección 9).
                               # vacío = el instalador te pregunta | "no" = no instalar
AMBE_TTY=""                    # AMBE3000 USB dongle (ThumbDV/DVstick), e.g. "/dev/ttyUSB0" → licensed digital voice
                               # llave USB AMBE3000, ej. "/dev/ttyUSB0" → voz digital con licencia
AMBE_BAUD="921600"             # in the advanced receiver · en el receptor avanzado. Old ThumbDV · antiguo: "460800"
INSTALL_WSJTX="no"             # "yes" = FT8/FT4/WSPR/JS8 in the advanced receiver (≈300 MB more)
                               # "si" = FT8/FT4/WSPR/JS8 en el receptor avanzado (≈300 MB más)

# --- Phone alerts (24/7 monitor alarms) · Avisos al celular (alarmas de la vigilancia 24/7) ---
NTFY_TOPIC=""                  # a hard-to-guess name, e.g. · un nombre difícil de adivinar, ej. "sdrkit-casa-7f3k9"
NTFY_SERVER="https://ntfy.sh"  # install the «ntfy» app and subscribe to that topic; needs internet on the Pi
                               # instala la app «ntfy» y suscríbete a ese tema; necesita internet en la Raspberry

# --- Updates (sudo sdrkit update, or More → System in the panel) ---
# --- Actualizaciones (sudo sdrkit actualizar, o Más → Sistema en el panel) ---
SDRKIT_REPO=""                 # empty = the GitHub repository you installed from · vacío = el repositorio de origen
SDRKIT_BRANCH=""               # empty = "main" (stable); e.g. "pruebas" to test changes
                               # vacío = "main" (estable); ej. "pruebas" para probar cambios

# --- Extras ---
INSTALL_TAILSCALE="si"         # secure remote access from anywhere (free for personal use)
                               # acceso remoto seguro desde cualquier lugar (gratis para uso personal)
TAILSCALE_AUTHKEY=""           # optional "tskey-auth-…" key to link it without a browser
                               # opcional: clave "tskey-auth-…" para enlazarlo sin abrir el navegador
DISABLE_BLUETOOTH="si"         # unused; turning it off improves WiFi (same chip) · no se usa; apagarlo mejora el WiFi
REDUCE_SD_WRITES="si"          # logs in RAM: longer microSD life · registros en RAM: alarga la vida de la microSD
UPGRADE_SYSTEM="no"            # "yes" = upgrade the whole system before installing (slower)
                               # "si" = actualiza todo el sistema antes de instalar (tarda más)
PANEL_PORT="80"
